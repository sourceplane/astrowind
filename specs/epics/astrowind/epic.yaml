# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (AW → AW-1, AW-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: astrowind
  key: AW
spec:
  title: "Vercel's AstroWind template on Cloudflare Workers"
  summary: "AstroWind — a free Astro + Tailwind CSS marketing site and blog (home, about, pricing, services and contact pages, landing and home demos, a Markdown/MDX blog with categories, tags, RSS and a sitemap) — builds fully static and is served as Cloudflare Workers Static Assets behind one small Worker, inside the Cirrus baseline's repository conventions, and becomes an Orun baseline that takes a new site from nothing to live on stage and prod in one landing."
  state: completed
  milestones:
    - name: "AW0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [AW-1]
    - name: "AW1 — the site on Workers"
      exitCriteria:
        - "apps/web is the upstream template, built static, with one Worker in front of dist/ as Workers Static Assets"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green"
        - "`wrangler dev` serves every page, post, demo, feed and sitemap, clean URLs, the immutable asset cache and the site's own 404"
        - "the README says how to run, test, preview and deploy it, and how every Vercel piece maps to Cloudflare"
      tasks: [AW-2]
    - name: "AW2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new site from nothing to live on stage and prod in one landing, then record it"
        - "a site built from it carries the site only, renamed throughout to its own name, repository and Worker, with the template's credit intact"
        - "Baseline CI is green: contract tests, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [AW-3]
