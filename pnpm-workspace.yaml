packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
  - "tooling/*"

# pnpm 10 blocks dependency build scripts unless allow-listed; wrangler's
# workerd and esbuild need theirs to verify their platform binaries.
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp

# The template's npm `overrides`, in pnpm's form: security floors on
# transitive dependencies, and astro-compress's sharp/svgo held to the
# versions the template ships with.
overrides:
  yaml: ">=2.8.3"
  "astro-compress>sharp": "^0.35.3"
  "astro-compress>svgo": "^4.1.0"
  "postcss>nanoid": "^3.3.18"
  deepmerge-ts: ">=8.0.2"
  fast-uri: "^3.1.6"
